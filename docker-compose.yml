services:
  postgres:
    image: postgres:16-alpine
    container_name: trackletv2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracklet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracklet_password_change_me}
      POSTGRES_DB: tracklet_platform
    volumes:
      - trackletv2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracklet -d tracklet_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tracklet-net

  panel:
    build: .
    image: trackletv2-platform-app:latest
    pull_policy: build
    container_name: trackletv2-panel
    restart: unless-stopped
    environment:
      MODE: panel
      PORT: 8080
      DATABASE_URL: "postgresql://tracklet:${POSTGRES_PASSWORD:-tracklet_password_change_me}@postgres:5432/tracklet_platform"
      SESSION_SECRET: "${SESSION_SECRET:-change-this-session-secret}"
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:-http://localhost}"
      DEFAULT_ADMIN_EMAIL: "${DEFAULT_ADMIN_EMAIL:-admin@tracklet.local}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-ChangeMe123!}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracklet-net

  wing:
    build: .
    image: trackletv2-platform-app:latest
    pull_policy: build
    container_name: trackletv2-wing-01
    restart: unless-stopped
    environment:
      MODE: wing
      PORT: 8080
      DATABASE_URL: "postgresql://tracklet:${POSTGRES_PASSWORD:-tracklet_password_change_me}@postgres:5432/tracklet_platform"
      WING_ID: wing-local
      WING_NAME: Local Wing
      WING_BASE_URL: http://wing:8080
      WING_TOKEN: "${WING_TOKEN:-change-this-wing-token}"
      INSTANCE_IMAGE: trackletv2-platform-app:latest
      DOCKER_NETWORK: trackletv2-platform-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      panel:
        condition: service_started
    networks:
      - tracklet-net

  nginx:
    build: ./nginx
    image: trackletv2-nginx:latest
    pull_policy: build
    container_name: trackletv2-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:80"
    depends_on:
      - panel
    networks:
      - tracklet-net

volumes:
  trackletv2-postgres-data:

networks:
  tracklet-net:
    name: trackletv2-platform-net
    driver: bridge
